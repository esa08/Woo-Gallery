<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wood Gallery</title>
<style>
  :root { color-scheme: dark; --bg:#0d0b09; --fg:#e8e0d4; --muted:#8c8274; --accent:#d9a066; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
               font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  #renderCanvas { width:100%; height:100%; display:block; touch-action:none; outline:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:14px; background:var(--bg); transition:opacity .5s; text-align:center; padding:24px; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  #bar { width:min(320px, 70vw); height:3px; background:#2a251f; border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #hint { background:rgba(13,11,9,.55); cursor:pointer; }
  #hint b { color:var(--accent); font-weight:600; }
  #hint small { color:var(--muted); }
  #msg { color:var(--muted); }
  #mute { position:fixed; right:16px; bottom:16px; z-index:5; background:rgba(13,11,9,.55); color:var(--fg); border:1px solid #3a322a;
          border-radius:20px; padding:6px 14px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<canvas id="renderCanvas" tabindex="0"></canvas>

<audio id="music" src="assets/audio/music.mp3" loop preload="auto"></audio>
<button id="mute" type="button">&#9835; Music: on</button>

<div id="loading" class="overlay">
  <div>Loading gallery&hellip;</div>
  <div id="bar"><i></i></div>
  <div id="msg"></div>
</div>

<div id="hint" class="overlay hidden">
  <div>Click to start walking</div>
  <div><b>W A S D</b>: walk &nbsp;&middot;&nbsp; <b>&larr; &rarr; &uarr; &darr;</b> or <b>mouse</b>: look around</div>
  <small>Esc to release the cursor &middot; M to mute music</small>
</div>

<!-- Pinned release, not the nightly root. Self-host before production. -->
<script src="https://cdn.babylonjs.com/v9.0.0/babylon.js"></script>
<script src="https://cdn.babylonjs.com/v9.0.0/loaders/babylonjs.loaders.min.js"></script>
<script src="src/main.js?v=1793865162"></script>
</body>
</html>
