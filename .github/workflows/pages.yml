name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # deploy only runtime: shared/ + per gallery gallery.json and variant folders (those with index.html); blend/, art/, build/, renders/ stay out
      - name: Assemble site
        run: |
          mkdir _site
          cp -r shared _site/
          for g in galleries/*/; do
            if [ ! -f "${g}gallery.json" ]; then continue; fi
            mkdir -p "_site/$g"
            cp "${g}gallery.json" "_site/$g"
            for v in "$g"*/; do
              if [ -f "${v}index.html" ]; then cp -r "$v" "_site/$g"; fi
            done
          done
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=galleries/hokkaido/full/"><title>Woo Gallery</title>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
