name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # runtime only (shared/, per gallery gallery.json + main.js/route.js/thumb.webp + variant folders) and the gallery
      # picker at the root; blend/, art/, build/, renders/ stay out. Same script locally: node tools/build_site.mjs <dir>
      - name: Assemble site
        run: node tools/build_site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
